<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - Career Profile</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">
    <div class="card">

        <h1>회원가입</h1>

        <p class="subtitle">
            Career Profile 서비스를 이용하기 위한 계정을 만들어주세요.
        </p>

        <p th:if="${error}"
           th:text="${error}"
           style="color: #d33; margin-bottom: 20px;">
        </p>

        <form action="/signup" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label>아이디</label>

                <input type="text"
                       name="username"
                       placeholder="아이디를 입력하세요"
                       required>
            </div>

            <div class="form-group">
                <label>비밀번호</label>

                <input type="password"
                       name="password"
                       placeholder="비밀번호를 입력하세요"
                       required>
            </div>

            <button class="save-button" type="submit">
                회원가입
            </button>

        </form>

        <div class="bottom-buttons">

            <a href="/"
               class="button secondary-button">
                메인으로
            </a>

        </div>

    </div>
</div>

</body>
</html>
