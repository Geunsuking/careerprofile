<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>새로운 정보 추가 - Career Profile</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>새로운 정보 추가</h1>

        <p class="subtitle">
            자격증, 경력 등 원하는 정보를 추가해주세요.
        </p>

        <form action="/profile/info" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label>항목 이름</label>
                <input type="text"
                       name="itemName"
                       placeholder="예: 자격증, 경력, 수상경력"
                       required>
            </div>

            <div class="form-group">
                <label>내용</label>
                <input type="text"
                       name="itemValue"
                       placeholder="내용을 입력하세요"
                       required>
            </div>

            <button class="save-button" type="submit">
                저장하기
            </button>

        </form>

        <div class="bottom-buttons">

            <a href="/profile/list"
               class="button secondary-button">
                프로필 보기
            </a>

            <a href="/"
               class="button secondary-button">
                메인으로
            </a>

        </div>

    </div>

</div>

</body>
</html>
