<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>정보 추가 - Career Profile</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>기본 정보 추가</h1>

        <p class="subtitle">
            이름, 학교, 전공, 학점을 입력해주세요.
        </p>

        <form action="/profile" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label>이름</label>
                <input type="text"
                       name="name"
                       placeholder="이름을 입력하세요"
                       required>
            </div>

            <div class="form-group">
                <label>학교</label>
                <input type="text"
                       name="school"
                       placeholder="학교를 입력하세요"
                       required>
            </div>

            <div class="form-group">
                <label>전공</label>
                <input type="text"
                       name="major"
                       placeholder="전공을 입력하세요"
                       required>
            </div>

            <div class="form-group">
                <label>학점</label>
                <input type="text"
                       name="grade"
                       placeholder="예: 2.82"
                       required>
            </div>

            <button class="save-button" type="submit">
                프로필 저장하기
            </button>

        </form>

        <div class="bottom-buttons">

            <a href="/profile/list"
               class="button secondary-button">
                프로필 보기
            </a>

            <a href="/"
               class="button secondary-button">
                메인으로
            </a>

        </div>

    </div>

</div>

</body>
</html>
