<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>정보 수정 - Career Profile</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>정보 수정</h1>

        <p class="subtitle">
            저장된 커리어 정보를 수정하세요.
        </p>

        <form action="/profile/info/update" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <input type="hidden"
                   name="id"
                   th:value="${careerInfo.id}">

            <div class="form-group">

                <label>항목 이름</label>

                <input type="text"
                       name="itemName"
                       th:value="${careerInfo.itemName}"
                       required>

            </div>

            <div class="form-group">

                <label>내용</label>

                <input type="text"
                       name="itemValue"
                       th:value="${careerInfo.itemValue}"
                       required>

            </div>

            <button class="save-button"
                    type="submit">
                수정 저장하기
            </button>

        </form>

        <div class="bottom-buttons">

            <a href="/profile/list"
               class="button secondary-button">
                프로필 보기
            </a>

            <a href="/"
               class="button secondary-button">
                메인으로
            </a>

        </div>

    </div>

</div>

</body>
</html>
