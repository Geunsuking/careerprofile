<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Career Profile</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

    <div class="card main-card">

        <h1>Career Profile</h1>

        <!-- 로그인하지 않은 경우 -->
        <div th:if="${username == null}">

            <p class="subtitle">
                나의 커리어 정보를 한 곳에서 관리하세요.
            </p>

            <div class="main-buttons">

                <a href="/login"
                   class="button main-button">
                    로그인
                </a>

                <a href="/signup"
                   class="button secondary-button">
                    회원가입
                </a>

            </div>

        </div>


        <!-- 로그인한 경우 -->
        <div th:if="${username != null}">

            <p class="subtitle">
                <strong th:text="${username}"></strong>님,
                환영합니다.
            </p>


            <!-- 프로필이 있는 경우 -->
            <div th:if="${profile != null}" class="profile-section">

                <!-- 이름 -->
                <div class="profile-name"
                     th:text="${profile.name}">
                    김근수
                </div>

                <div class="main-buttons">

                    <!-- 프로필 보러가기 -->
                    <a href="/profile/list"
                       class="button profile-view-button">
                        프로필 보러가기
                    </a>

                    <!-- 프로필 수정 -->
                    <a th:href="@{/profile/edit(id=${profile.id})}"
                       class="button sub-button full-button">
                        프로필 수정
                    </a>

                    <!-- 새로운 정보 추가 -->
                    <a href="/profile/info/add"
                       class="button sub-button full-button">
                        새로운 정보 추가
                    </a>

                </div>

            </div>


            <!-- 프로필이 없는 경우 -->
            <div th:if="${profile == null}">

                <p class="profile-empty">
                    아직 프로필이 없습니다.
                </p>

                <div class="main-buttons">

                    <!-- 프로필 작성 -->
                    <a href="/profile/add"
                       class="button main-button">
                        프로필 작성
                    </a>

                </div>

            </div>


            <!-- 로그아웃 -->
            <div class="logout-area">

                <form action="/logout"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit"
                            class="button secondary-button logout-button">
                        로그아웃
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
